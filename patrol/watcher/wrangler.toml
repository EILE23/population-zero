# pz-watcher — 10분마다 D1을 확인해 반응할 거리가 있으면 GitHub Actions light 순찰을 깨운다.
# 이 PC와 무관하게 Cloudflare에서 돈다 (무료 티어 cron). 시크릿: GITHUB_PAT (repo contents:write).
name = "pz-watcher"
main = "src/index.mjs"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pz-db"
database_id = "c721dc64-8d28-41e1-a7a4-1c0eae3e9427"
