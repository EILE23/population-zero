# 사람이 /play 에서 설명한 게임을 Claude Code 가 엔진 위에 구현해 배포한다 — 큐에서 한 번에 하나. 사람 머지 없음.
#
# 경계(2026-09-22 리뷰 뒤): 에이전트는 **자격증명이 하나도 없는 잡**에서 돈다 — git 쓰기 토큰 없음(persist-credentials: false),
# Cloudflare 토큰 없음. 산출물은 허용 경로 세 가지(자기 폴더·registry·로그)만 아티팩트로 건너가고, 깨끗한 잡이
# 최신 main 위에 얹어 정적 검사(patrol/games-check.mjs: import 허용 목록·네트워크·저장소·eval·DOM 주입 금지)와
# 게이트(tsc·tests·build)를 통과한 것만 커밋·배포한다. 에이전트가 레포의 다른 곳을 고쳤어도 건너오지 않는다.
# 킬스위치: 레포 변수 GAMES=off. 하루 세 번.
name: build-game

on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 KST
    - cron: '0 4 * * *'    # 13:00 KST
    - cron: '0 12 * * *'   # 21:00 KST
  workflow_dispatch:

concurrency:
  group: grow-code          # 성장 잡과 같은 그룹 — 둘이 동시에 main 에 푸시하지 않게
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf

jobs:
  # 1) 큐에서 하나 뽑는다 — D1 토큰이 필요한 유일한 앞단계
  pick:
    if: vars.GAMES != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (wrangler only)
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Tidy the growth documents
        run: node patrol/grow-tidy.mjs

      - name: Pick the next request
        id: pick
        working-directory: patrol
        run: |
          SLUG=$(node games-queue.mjs pick /tmp/game-request.json | tail -1)
          echo "slug=$([ "$SLUG" = none ] && echo '' || echo "$SLUG")" >> "$GITHUB_OUTPUT"
          echo "picked: $SLUG"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.slug != ''
        with:
          name: game-request
          path: /tmp/game-request.json
          retention-days: 1

  # 2) 에이전트 — 자격증명 없음. 산출물은 허용 경로만 아티팩트로
  build:
    needs: pick
    if: needs.pick.outputs.slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ needs.pick.outputs.slug }}
      npm_config_frozen_lockfile: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 에이전트 프로세스에 git 쓰기 토큰이 없다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: game-request
          path: /tmp
      - name: Install
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Build the game
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --dangerously-skip-permissions -p "Read patrol/GAMES.md and build the game described in /tmp/game-request.json, exactly as that file says. Repo root is the current directory. Do not run git commit or git push. End with one line starting with SUMMARY:." --output-format stream-json --verbose > /tmp/build.jsonl || true
          node -e "const l=require('fs').readFileSync('/tmp/build.jsonl','utf8').trim().split('\n');for(const x of l.slice(-3)){try{const e=JSON.parse(x);if(e.type==='result')console.log('RESULT:',String(e.result??'').slice(0,800))}catch{}}" || true
          grep -o 'SUMMARY:.*' /tmp/build.jsonl | tail -1 | sed 's/SUMMARY: *//' | tr -d '"\\' | cut -c1-72 > /tmp/summary.txt || true
      # 허용 경로만 건너간다 — 그 밖에 무엇을 바꿨든 이 잡과 함께 사라진다
      - name: Pack the allowed paths
        run: |
          mkdir -p /tmp/out
          git status --porcelain
          [ -d "site/src/features/games/${SLUG}" ] && cp -r "site/src/features/games/${SLUG}" /tmp/out/game || echo "no game folder"
          cp site/src/features/games/registry.ts /tmp/out/registry.ts
          cp patrol/GAMES-LOG.md /tmp/out/GAMES-LOG.md
          cp /tmp/summary.txt /tmp/out/summary.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: game-output
          path: /tmp/out
          retention-days: 1
          if-no-files-found: error

  # 3) 깨끗한 잡 — 최신 main 위에 얹고, 검사·게이트를 통과한 것만 커밋·배포
  ship:
    needs: [pick, build]
    if: needs.pick.outputs.slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: ${{ needs.pick.outputs.slug }}
      npm_config_frozen_lockfile: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: game-output
          path: /tmp/out
      - name: Install
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Apply the allowed paths onto main
        run: |
          [ -d /tmp/out/game ] || { echo "no game folder came back"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; }
          rm -rf "site/src/features/games/${SLUG}"
          cp -r /tmp/out/game "site/src/features/games/${SLUG}"
          cp /tmp/out/registry.ts site/src/features/games/registry.ts
          cp /tmp/out/GAMES-LOG.md patrol/GAMES-LOG.md
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then echo "nothing changed"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi
          LINES=$(git diff --cached --numstat | awk '{a+=$1+$2} END {print a+0}'); echo "changed lines: $LINES"
          if [ "$LINES" -gt 2500 ]; then echo "too big — discarding"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi
          # registry: 이 slug 의 한 줄만 더해졌어야 한다 — 다른 게임 줄을 건드리면 버린다.
          # 에이전트는 자기 시점의 main 을 봤으므로, 그 사이 main 의 registry 가 바뀌었으면(다른 게임 등록) 그 줄만 다시 얹는다.
          if git diff --cached --quiet -- site/src/features/games/registry.ts; then echo "registry not updated"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi
          REM=$(git diff --cached --numstat -- site/src/features/games/registry.ts | awk '{print $2+0}')
          if [ "${REM:-0}" -gt 0 ]; then
            echo "registry removed lines — re-applying just this slug's line onto main's registry"
            LINE=$(grep "slug: '${SLUG}'" /tmp/out/registry.ts | head -1)
            git checkout HEAD -- site/src/features/games/registry.ts
            [ -n "$LINE" ] && node -e "const fs=require('fs');const p='site/src/features/games/registry.ts';let s=fs.readFileSync(p,'utf8');const line=process.argv[1];if(!s.includes(line)){s=s.replace(/\n\];/, '\n'+line+'\n];');fs.writeFileSync(p,s);}" "$LINE"
            git add -A
          fi
          ADD=$(git diff --cached --numstat -- site/src/features/games/registry.ts | awk '{print $1+0}'); REM=$(git diff --cached --numstat -- site/src/features/games/registry.ts | awk '{print $2+0}')
          if [ "${ADD:-0}" -ne 1 ] || [ "${REM:-0}" -ne 0 ]; then echo "registry change is not exactly one added line (+$ADD -$REM) — discarding"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi
          grep -q "slug: '${SLUG}'" site/src/features/games/registry.ts || { echo "slug not registered"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; }
          # 로그 밖의 파일이 섞였는지 마지막으로 — 아티팩트 구조상 있을 수 없지만 확인은 한 줄이다
          BAD=$(git diff --cached --name-only | grep -v -E "^(site/src/features/games/${SLUG}/|site/src/features/games/registry\.ts$|patrol/GAMES-LOG\.md$|patrol/GROW-BACKLOG\.md$|patrol/GROW-DONE\.md$|patrol/growth/)" || true)
          if [ -n "$BAD" ]; then echo "out-of-scope paths: $BAD"; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi

      - name: Static check — imports, network, storage, eval, DOM injection
        if: env.nothing != '1'
        run: node patrol/games-check.mjs "$SLUG" || { echo "nothing=1" >> "$GITHUB_ENV"; echo "static check failed"; }

      - name: Gate — typecheck, tests, build
        if: env.nothing != '1'
        working-directory: site
        run: |
          npx tsc --noEmit -p .
          node tests/schema-parity.test.mjs
          node --experimental-strip-types tests/app-parity.test.mjs
          npx wrangler d1 execute pz-db --local --file=./schema.sql >/dev/null
          NEXT_PRIVATE_STANDALONE=true npx next build
          npx opennextjs-cloudflare build --skipNextBuild

      - name: Commit, sync with main, deploy what was pushed
        if: env.nothing != '1'
        run: |
          git config user.name "square-grow"
          git config user.email "square-grow@population.town"
          SUMMARY=$(cat /tmp/out/summary.txt 2>/dev/null | head -1)
          git commit -q -m "feat(play): ${SLUG} — ${SUMMARY:-a game someone described} [game]"
          # 게이트를 도는 동안(≈10분) 사람이 main 을 밀었을 수 있다. 그러면 그 위로 다시 올리고 **다시 빌드해서** 배포한다 —
          # 예전엔 rebase 뒤에 rebase 전의 .open-next 를 올려서, 사람의 커밋을 되돌린 상태가 라이브가 됐다.
          # 충돌은 병합하지 않는다(-X ours 는 사람의 편집을 조용히 버렸다): 실패로 남기고 큐가 한 번 더 시도한다.
          git fetch -q origin main
          if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during the gate — rebasing and rebuilding"
            git rebase -q origin/main || { git rebase --abort; echo "rebase conflict — leaving it for the next attempt"; exit 1; }
            (cd site && npx tsc --noEmit -p . && NEXT_PRIVATE_STANDALONE=true npx next build && npx opennextjs-cloudflare build --skipNextBuild)
          fi
          git push origin HEAD:main
          (cd site && npx wrangler deploy)
          (cd patrol && node games-queue.mjs done "$SLUG" "${SUMMARY:-built}")

      - name: Mark failed
        if: failure() || env.nothing == '1'
        run: cd patrol && node games-queue.mjs fail "$SLUG" "the build did not pass — the developer will try once more"

  # 에이전트 잡 자체가 죽었을 때도 큐를 되돌린다(ship 은 build 가 실패하면 돌지 않는다)
  unmark:
    needs: [pick, build]
    if: needs.pick.outputs.slug != '' && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLUG: ${{ needs.pick.outputs.slug }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts
      - run: cd patrol && node games-queue.mjs fail "$SLUG" "the developer job did not finish — it will try once more"
