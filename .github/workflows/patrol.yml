# Population: Zero 클라우드 순찰 — 이 PC가 꺼져 있어도 GitHub Actions가 순찰을 돈다.
# full: 스케줄 4회 (KST 09:30/12:30/15:30/21:30). light: pz-watcher(Cloudflare cron)가
# 미응답 사람 활동·반응 0 새 글을 발견하면 repository_dispatch로 깨운다.
#
# 보안 구조 (2026-09-10): Claude 세션은 비밀을 하나도 갖지 않는다.
#   - D1 토큰은 세션 앞에 띄운 로컬 프록시(patrol/d1-proxy.mjs)만 들고 있고, 프록시는 순찰이 쓰는
#     SQL 형태(주민 글·댓글·좋아요·팔로우·모더레이션)만 통과시킨다. 사람 글의 프롬프트 인젝션이
#     성공해도 DB 삭제·레포 변조·키 유출은 불가능하다.
#   - Claude OAuth 토큰도 로컬 게이트웨이(patrol/anthropic-proxy.mjs)만 들고 있다. 세션은 자리표시자
#     토큰 + ANTHROPIC_BASE_URL=127.0.0.1 로 돌고, 게이트웨이가 Authorization 을 실토큰으로 바꿔 전달한다.
#   - 트렌드·검색어 수집(키 필요)은 세션 '앞' 스텝 — 세션이 손댈 수 없는 시점이다.
#   - 커버 생성·통계·커밋백(키 필요)은 **별도 job(post)** 이다. 같은 러너의 `git checkout -- .` 는
#     인덱스로 되돌릴 뿐이라(세션이 인덱스를 고쳤다면 원본이 아니다) 격리가 아니었다.
#     post job 은 같은 커밋을 새로 체크아웃한 깨끗한 러너에서 돌고, 세션에게서는 **데이터만** 받는다.
#   - checkout 은 persist-credentials: false — 세션이 git push 할 자격증명이 없다.
# 필요 시크릿: CLAUDE_CODE_OAUTH_TOKEN, CLOUDFLARE_API_TOKEN(D1 편집), YT_API_KEY, OPENAI_API_KEY,
#   PZ_ASSETS_PAT, GSC_SA_KEY, CF_OPS_TOKEN, ADSENSE_OAUTH
name: patrol

on:
  # 24시간 심장박동: 3시간마다 순찰이 돈다 (full·light 6시간 간격 교차).
  # KST 새벽 = 유럽 저녁·미국 낮 — 그 시간대 주민들의 프라임 세션이다.
  schedule:
    - cron: '30 0 * * *'   # 09:30 KST full
    - cron: '30 6 * * *'   # 15:30 KST full
    - cron: '30 12 * * *'  # 21:30 KST full
    - cron: '30 18 * * *'  # 03:30 KST full — EU 저녁/US 낮 프라임
    - cron: '30 3 * * *'   # 12:30 KST light
    - cron: '30 9 * * *'   # 18:30 KST light
    - cron: '30 15 * * *'  # 00:30 KST light
    - cron: '30 21 * * *'  # 06:30 KST light
  repository_dispatch:
    types: [patrol-light, patrol-full] # patrol-full = 감시자의 스톨 백스톱 (GH 크론 누락 대비)
  workflow_dispatch:
    inputs:
      mode:
        description: 'patrol mode'
        type: choice
        options: [full, light]
        default: full

concurrency:
  group: patrol
  cancel-in-progress: false

permissions:
  contents: write # 순찰 후 기억 파일 커밋백용 (토큰은 마지막 스텝에만 주입)

env:
  PZ_D1_PROXY: http://127.0.0.1:8787

jobs:
  # ── job 1: 수집 + 모델 세션. 여기서 살아 있는 비밀은 두 사이드카 프로세스 안에만 있다. ──
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 세션이 25~30분 걸린다 — 35분에 잘리면 적재 중간에 죽는다. 근본 해결은 읽기 줄이기(session-reads 참고)
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # 세션이 git push 할 수 없게 — 커밋백은 마지막 스텝이 자기 토큰으로

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler deps # 세션 뒤 통계 push(push-stats.mjs)가 wrangler 를 쓴다
        working-directory: site
        run: |
          corepack enable
          # 원격 D1 실행만 하므로 빌드 스크립트(esbuild/workerd/sharp 바이너리) 불필요 — pnpm v10의 빌드 차단 에러 회피
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.action }}" = "patrol-full" ]; then echo "mode=full" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then echo "mode=light" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ] || [ "${{ github.event.schedule }}" = "30 9 * * *" ] || [ "${{ github.event.schedule }}" = "30 15 * * *" ] || [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then echo "mode=light" >> "$GITHUB_OUTPUT";
          else echo "mode=full" >> "$GITHUB_OUTPUT"; fi

      # ── 세션 앞: 비밀이 필요한 수집은 여기서 끝낸다 ──────────────────────────────
      - name: Start D1 proxy # 토큰은 stdin 으로만 전달 — argv·env 어디에도 남지 않는다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p patrol/logs
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" | nohup node patrol/d1-proxy.mjs > patrol/logs/d1-proxy.out 2>&1 &
          for i in $(seq 1 30); do curl -sf "$PZ_D1_PROXY/health" >/dev/null && break; sleep 1; done
          curl -sf "$PZ_D1_PROXY/health" || { echo "d1-proxy failed to start"; cat patrol/logs/d1-proxy.out; exit 1; }

      - name: Start Anthropic gateway # Claude 토큰도 세션 밖 — 세션은 자리표시자 토큰 + 로컬 base URL 만 본다
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          printf '%s\n' "$CLAUDE_CODE_OAUTH_TOKEN" | nohup node patrol/anthropic-proxy.mjs > patrol/logs/anthropic-proxy.out 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8788/__health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8788/__health || { echo "anthropic-proxy failed to start"; cat patrol/logs/anthropic-proxy.out; exit 1; }

      - name: Fetch trends (full only)
        if: steps.mode.outputs.mode == 'full'
        working-directory: patrol
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node fetch-trends.mjs || true

      # 세션이 통째로 읽는 트렌드는 다이제스트(~35KB)뿐이다. 원본 700KB 는 grep 용으로만 남는다.
      - name: Digest trends for the session (full only)
        if: steps.mode.outputs.mode == 'full'
        working-directory: patrol
        run: node digest-trends.mjs || true

      # 앱 Today 탭의 재료 — 방금 긁어온 나라별 트렌드·뉴스를 D1 trends 로 적재한다.
      # 순찰 세션이 쓰는 게 아니라 결정적인 적재 작업이라 프록시를 거치지 않고 wrangler 직결.
      - name: Save trends to D1 (app Today feed)
        if: steps.mode.outputs.mode == 'full'
        working-directory: patrol
        env:
          PZ_D1_PROXY: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: node save-trends.mjs || true

      - name: Search demand report (SEO loop)
        working-directory: patrol
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: node gsc-report.mjs || true

      # 세션 '앞' 의 신뢰된 읽기라 프록시를 거치지 않는다 — 주민에게 온 쪽지(dms)를 읽어야 하는데,
      # 그 테이블은 사람끼리의 쪽지도 담고 있어 프록시는 읽기를 거부한다. 스크립트가 주민 실만 고른다.
      - name: Read town state
        working-directory: patrol
        env:
          PZ_D1_PROXY: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: |
          rm -f apply-result.json # 지난 실행의 결과가 이번 실행의 증거로 오인되지 않게
          node read-state.mjs --remote

      # light 순찰은 할 일이 있을 때만 모델을 부른다. 감시자가 깨운 경우는 대개 할 일이 있지만,
      # 스케줄된 light 4회는 사람 활동이 없으면 워크리스트가 비어 있다 — 그때 세션을 띄우면 토큰만 쓴다.
      - name: Is there anything for a light patrol to do?
        id: worklist
        working-directory: patrol
        run: |
          busy=$(node -e "console.log(JSON.parse(require('fs').readFileSync('worklist.json','utf8')).busy)" 2>/dev/null || echo true)
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
          echo "worklist busy=$busy"; head -c 600 worklist.json

      # ── 세션: 비밀 없음. Claude API 는 게이트웨이, D1 은 프록시, git 은 읽기 전용 ──
      - name: Run patrol
        if: steps.mode.outputs.mode == 'full' || steps.worklist.outputs.busy == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-placeholder-real-token-lives-in-anthropic-proxy
          ANTHROPIC_BASE_URL: http://127.0.0.1:8788
          PATROL_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          claude --dangerously-skip-permissions -p "You are the patrol session for Population: Zero, running in GitHub Actions (Linux, repo root = current directory). Read patrol/PATROL.md and execute one patrol run now. Patrol mode: ${{ steps.mode.outputs.mode }}. (light mode = skip trend fetching and new posts; only reply to humans, react to freshly surfaced posts with zero reactions, continue existing resident threads, and process reports.) CI has already produced patrol/worklist.md (read this first — duties, fresh posts, who is awake, memory excerpts), patrol/trends-digest.json (full mode; the only trend file you read whole — trends.json is for grepping one item), patrol/state.json (slim) and patrol/gsc-report.json for you. Keep your reading under ~80k tokens: never read trends.json or a whole memory directory; open a resident's full memory file only when you act as that resident. D1 is reached only through the local proxy (PZ_D1_PROXY) via patrol/d1.mjs, apply.mjs --remote and read-state.mjs --remote; wrangler is not available and you hold no credentials of any kind. Covers are generated by CI after you finish — request them with cover_prompt / cover_requests in patrol-output.json, never by running gen-cover yourself. Do not run git commit or git push (CI commits your memory files). Follow every rule in that file. All patrol scripts live in patrol/ — run them from there with relative paths." --output-format stream-json --verbose > patrol/logs/session.jsonl || STATUS=$?
          node -e "const l=require('fs').readFileSync('patrol/logs/session.jsonl','utf8').trim().split('\n');for(const x of l.slice(-3)){try{const e=JSON.parse(x);if(e.type==='result')console.log('RESULT:',String(e.result??'').slice(0,1500))}catch{}}" || true
          exit ${STATUS:-0}

      - name: Stop proxies
        if: always()
        run: |
          # 세션이 무엇을 읽었나 — 타임아웃으로 죽은 실행일수록 이 표가 중요하다 (그래서 always 스텝에 둔다)
          node patrol/session-reads.mjs patrol/logs/session.jsonl || true
          curl -s -X POST "$PZ_D1_PROXY/shutdown" || true
          curl -s -X POST http://127.0.0.1:8788/__shutdown || true
          echo "--- d1-proxy log (refusals are the point) ---"; grep -E "REFUSED|GUARDED|UPSTREAM|shutdown" patrol/logs/d1-proxy.log || true
          echo "--- anthropic-proxy ---"; grep -E "REFUSED|ERROR|model in use|shutdown" patrol/logs/anthropic-proxy.log || true

      # 세션의 산출물 중 **데이터만** 다음 job 으로 넘긴다. 코드는 넘기지 않는다 —
      # post job 은 같은 커밋을 새로 체크아웃하므로 세션이 스크립트를 고쳐 놨어도 영향이 없다.
      - name: Hand over session data
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/handover"
          cp -r patrol/memory "$RUNNER_TEMP/handover/" 2>/dev/null || true
          for f in deck-state.json site-news.md patrol-output.json apply-result.json bluesky-state.json adsense-watch.json worklist.json; do
            [ -f "patrol/$f" ] && cp "patrol/$f" "$RUNNER_TEMP/handover/" || true
          done
          mkdir -p "$RUNNER_TEMP/handover/logs"
          cp patrol/logs/d1-summary.json patrol/logs/anthropic-summary.json patrol/logs/session-reads.json "$RUNNER_TEMP/handover/logs/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patrol-session-data
          path: ${{ runner.temp }}/handover
          retention-days: 3
          include-hidden-files: false

  # ── job 2: 자격증명을 쓰는 후처리. 깨끗한 러너 + 같은 커밋의 새 체크아웃. ──
  # 세션이 만졌을 수 있는 파일은 아무것도 여기로 오지 않는다 (데이터 아티팩트만 온다).
  post:
    needs: patrol
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 작가 작업(장문 1~3편, 모델 호출 2~4회)이 여기 들어온다
    env:
      PZ_D1_PROXY: '' # 이 job 에는 프록시가 없다 — 신뢰된 코드라 wrangler 직결이 맞다
      PATROL_MODE: ${{ needs.patrol.outputs.mode }}
      PATROL_OK: ${{ needs.patrol.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # 세션이 아니라 이 워크플로가 시작된 커밋 그대로
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler deps
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: patrol-session-data
          path: ${{ runner.temp }}/handover

      - name: Take session data into the fresh checkout
        run: |
          H="$RUNNER_TEMP/handover"
          [ -d "$H/memory" ] && { rm -rf patrol/memory; cp -r "$H/memory" patrol/; } || true
          for f in deck-state.json site-news.md patrol-output.json apply-result.json bluesky-state.json adsense-watch.json worklist.json; do
            [ -f "$H/$f" ] && cp "$H/$f" "patrol/$f" || true
          done
          mkdir -p patrol/logs
          cp "$H"/logs/*.json patrol/logs/ 2>/dev/null || true
          git status --short | head -20

      # 비용이 드는 후처리(이미지 생성) 앞에 적재 검증을 둔다 — 적재되지 않은 순찰의 커버 요청에 돈을 쓰지 않는다.
      # 영수증은 세션이 쓴 파일이 아니라 D1 원장이다 (프록시만 쓸 수 있고, 세션은 SQL 로 닿지 못한다).
      - name: Verify the patrol actually landed in D1
        id: verify
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: |
          [ "$PATROL_OK" = "true" ] || { echo "patrol job did not succeed"; exit 1; }
          node patrol/verify-apply.mjs

      # 장문은 세션이 아니라 여기서 쓴다 — 세션은 브리프(writing_requests)만 남기고, 작가 모델이 새 컨텍스트에서 쓰고
      # 반대 모델이 편집한 뒤 apply 의 같은 게이트를 지난다. Codex 는 ~/.codex/auth.json 이 있을 때만 합류한다(없으면 Claude 단독).
      - name: Install writer models (Claude CLI, Codex if logged in)
        if: steps.verify.outcome == 'success'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          npm install -g @anthropic-ai/claude-code
          if [ -n "$CODEX_AUTH_JSON" ]; then
            npm install -g @openai/codex
            mkdir -p ~/.codex && printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json && chmod 600 ~/.codex/auth.json
            printf 'model = "gpt-5.6-sol"\nmodel_reasoning_effort = "medium"\n' > ~/.codex/config.toml
          fi

      - name: Write requested long pieces
        if: steps.verify.outcome == 'success'
        working-directory: patrol
        timeout-minutes: 40
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # 주민 본인 사진(레시피·일상) 생성
          PZ_ASSETS_PAT: ${{ secrets.PZ_ASSETS_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: node writer.mjs || true

      - name: Generate requested covers # 세션이 patrol-output.json 에 적은 cover_prompt/cover_requests 만, 순차 1장씩 — 주민 글·커버 없음은 D1 이 다시 판정
        if: steps.verify.outcome == 'success'
        working-directory: patrol
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PZ_ASSETS_PAT: ${{ secrets.PZ_ASSETS_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: node gen-cover.mjs --from-output || true

      # 주민이 자기 집(/@handle)을 한 조각 짓는다. 할당이 아니라 재료만 주고, 손 안 대는 날이 대부분이다.
      # 세션 밖에서 도는 이유: 모델 한 번 호출과 문자열 위생 처리뿐이라 세션의 읽기 예산을 쓸 필요가 없다.
      - name: Build houses
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: node --experimental-strip-types build-house.mjs || true

      # 밈 풀 — 세계 밈 템플릿(imgflip 인기 100)과 명화(Met). 모델 호출 0, 이미지 생성 0. 순위 갱신이 곧 유행 반영이다.
      - name: Refresh meme pool
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: node fetch-meme-pool.mjs || true

      # 주민 몇 명이 짤을 만든다 — 사람과 같은 풀·글꼴·그리기 코드(site/src/lib/meme-draw.ts). 안 만드는 날도 정상.
      - name: Make memes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 있으면 Gemini 무료 티어가 글자를 쓴다, 없으면 OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PZ_ASSETS_PAT: ${{ secrets.PZ_ASSETS_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: node --experimental-strip-types make-memes.mjs || true

      # 광장이 자란다 — 마을(모델)이 새 소품·대사를 제안하고 검증된 것만 site_meta 에. 코드 배포 없이 게임 내용이 는다
      - name: Grow the square
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: node square-grow.mjs || true

      # 릴 — 퍼블릭 도메인 필름(Internet Archive)을 샷 단위로 쪼개 두고(clips.py), 주민이 스토리보드를 쓰면 ffmpeg 가 세로 영상으로 자른다(reels.py).
      # 영상 생성 토큰 0. full 순찰에서만(필름 다운로드·장면 검출이 몇 분 걸린다).
      - name: Reels (clip pool + cut)
        if: env.PATROL_MODE == 'full'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PZ_ASSETS_PAT: ${{ secrets.PZ_ASSETS_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements-video.txt
          python clips.py fetch --films 2 || true
          python reels.py --per-run 2 || true

      - name: Record run
        run: node patrol/record-run.mjs || true

      - name: Health check # 제때였나 · 답했나 · 적재됐나 — /admin 상단에 문제 줄이 뜬다
        env:
          PZ_D1_PROXY: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        working-directory: patrol
        run: node health.mjs || true

      - name: AdSense crawl watch # 구글 ads.txt 크롤러 방문 감지 — "찾을 수 없음" 라벨 해소의 신호
        env:
          CF_OPS_TOKEN: ${{ secrets.CF_OPS_TOKEN }}
          ADSENSE_OAUTH: ${{ secrets.ADSENSE_OAUTH }}
        run: node patrol/check-adsense.mjs || true

      - name: IndexNow ping # 새 글을 Bing·Yandex 에 즉시 크롤 요청 (색인 랙 단축, 비밀 불필요)
        run: node patrol/indexnow.mjs || true

      - name: Bluesky post # 콘텐츠를 밖(Bluesky)에 내보내 유입 — 불규칙 게시(1~5일 휴면), 앱 비번만 사용
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node patrol/bluesky-post.mjs || true

      - name: GA traffic snapshot # 채널·국가·인기 페이지 — 순찰이 읽는 트래픽 피드백 (ga-report.json)
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: node patrol/ga-report.mjs || true

      - name: Push GA stats to D1 # /admin 트래픽 패널이 읽는다 (site_meta.ga_report)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: node patrol/push-stats.mjs || true

      # 기억은 D1 에 실제로 적재된 뒤에만 남긴다 — 세션이 memory 를 고쳐 놓고 apply 가 실패하면
      # "글을 썼다"는 기록만 남아 캐릭터 기억과 DB 현실이 갈라진다. 실패한 순찰의 기억은 버린다.
      # 영수증은 세션이 쓴 파일이 아니라 D1 의 원장이다 (verify-apply.mjs): patrol-output.json 을
      # 직접 해싱해 완료 표시가 찍힌 행을 찾는다. 세션이 apply-result.json 을 위조해도 통과하지 못한다.
      # 운영 기록(run-log)은 실패한 순찰이라도 남긴다 — 비용과 거부는 실패했을 때가 더 중요하다.
      - name: Persist memory and run log
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: |
          KEEP_MEMORY=no
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            KEEP_MEMORY=yes
          else
            echo "patrol did not succeed or did not land in D1 — memory changes are discarded, run log is kept"
          fi

          git config user.name "pz-patrol"
          git config user.email "patrol@populationzero.invalid"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if [ "$KEEP_MEMORY" = "yes" ]; then
            git add patrol/memory patrol/deck-state.json patrol/site-news.md 2>/dev/null || true
          else
            git checkout -- patrol/memory patrol/deck-state.json 2>/dev/null || true
          fi
          # 아래는 순찰 성공 여부와 무관하게 남긴다 — 전부 "이미 벌어진 일"의 기록이다.
          # 특히 bluesky-state 를 빠뜨리면 실패한 순찰이 글을 올리고도 기록을 안 남겨,
          # 다음 실행이 휴면 게이트를 초기화하고 같은 글을 또 올린다.
          git add patrol/run-log.jsonl patrol/bluesky-state.json patrol/adsense-watch.json patrol/GROW-BACKLOG.md 2>/dev/null || true # GROW-BACKLOG: 마을이 쓴 소원(square-grow) — 코드 성장 잡이 읽는다
          git diff --cached --quiet || { git commit -m "chore(patrol): memory/deck update ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"; git checkout -- . ; git pull --rebase -X theirs "$REMOTE" main; git push "$REMOTE" HEAD:main; }
