# 광장의 코드가 스스로 자란다 — 하루 한 번 Claude Code 가 GROW.md 대로 기능 하나를 구현하고, 타입체크·테스트·빌드가 통과하면 커밋하고 배포한다.
# 사람 머지 없음. 안전장치: 경로 허용 목록(밖을 건드리면 버림), 게이트(tsc·tests·build), 하루 한 번, 킬스위치(레포 변수 GROW_CODE=off).
name: grow-code

on:
  schedule:
    - cron: '30 19 * * *'   # 04:30 KST
  workflow_dispatch:

concurrency:
  group: grow-code
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grow:
    if: vars.GROW_CODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      npm_config_frozen_lockfile: 'false' # CI 에선 pnpm 이 lockfile 을 얼리는데, 여기 lockfile 은 로컬 pnpm 과 overrides 표기가 달라 빌드가 죽는다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Implement one backlog item
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --dangerously-skip-permissions -p "Read patrol/GROW.md and do exactly what it says for today. Repo root is the current directory. Do not run git commit or git push; the workflow does that. When done, print a one-line summary starting with SUMMARY:." --output-format stream-json --verbose > /tmp/grow.jsonl || true
          node -e "const l=require('fs').readFileSync('/tmp/grow.jsonl','utf8').trim().split('\n');for(const x of l.slice(-3)){try{const e=JSON.parse(x);if(e.type==='result')console.log('RESULT:',String(e.result??'').slice(0,800))}catch{}}" || true

      # 허용 경로 밖의 변경은 되돌린다 — 모델이 어디를 만졌든 규칙이 이긴다
      - name: Enforce the allowed paths
        run: |
          git add -A
          CHANGED=$(git diff --cached --name-only)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -v -E '^(site/src/features/square/|site/src/lib/goose\.ts|site/src/lib/world\.ts|site/src/lib/stickman\.ts|site/src/lib/pond\.ts|patrol/GROW-BACKLOG\.md|patrol/GROW-LOG\.md)' || true)
          if [ -n "$BAD" ]; then echo "reverting out-of-scope changes:"; echo "$BAD"; echo "$BAD" | xargs -r git checkout HEAD -- ; echo "$BAD" | xargs -r git rm -q --cached --ignore-unmatch; fi
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then echo "nothing=1" >> "$GITHUB_ENV"; fi
          LINES=$(git diff --cached --numstat | awk '{a+=$1+$2} END {print a+0}'); echo "changed lines: $LINES"
          if [ "$LINES" -gt 900 ]; then echo "too big — discarding"; git reset -q --hard; echo "nothing=1" >> "$GITHUB_ENV"; fi

      - name: Gate — typecheck, tests, build
        if: env.nothing != '1'
        working-directory: site
        run: |
          npx tsc --noEmit -p .
          node tests/schema-parity.test.mjs
          node tests/app-parity.test.mjs || true
          npx opennextjs-cloudflare build

      - name: Commit and deploy
        if: env.nothing != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: |
          git config user.name "square-grow"
          git config user.email "square-grow@population.town"
          SUMMARY=$(grep -o 'SUMMARY:.*' /tmp/grow.jsonl | tail -1 | sed 's/SUMMARY: *//' | tr -d '"\\' | cut -c1-72)
          git commit -q -m "feat(square): ${SUMMARY:-daily growth} [grow]"
          git pull -q --rebase origin main || true
          git push origin HEAD:main
          cd site && npx opennextjs-cloudflare deploy
