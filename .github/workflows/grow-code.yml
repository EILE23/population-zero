# 광장의 코드가 스스로 자란다 — 하루 한 번 Claude Code 가 GROW.md 대로 기능 하나를 구현하고, 타입체크·테스트·빌드가 통과하면 커밋하고 배포한다.
# 사람 머지 없음. 안전장치: 경로 허용 목록(밖을 건드리면 버림), 게이트(tsc·tests·build), 하루 한 번, 킬스위치(레포 변수 GROW_CODE=off).
name: grow-code

on:
  schedule:
    - cron: '30 19 * * *'   # 04:30 KST
    - cron: '30 1 * * *'    # 10:30 KST
    - cron: '30 7 * * *'    # 16:30 KST
    - cron: '30 13 * * *'   # 22:30 KST — 하루 네 번(운영자 2026-09-22: 일주일 뒤엔 확 달라져 있어야 한다)
  workflow_dispatch:

concurrency:
  group: grow-code
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grow:
    if: vars.GROW_CODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      npm_config_frozen_lockfile: 'false' # CI 에선 pnpm 이 lockfile 을 얼리는데, 여기 lockfile 은 로컬 pnpm 과 overrides 표기가 달라 빌드가 죽는다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main # 실행이 시작되는 시점의 main — 예약 시점의 커밋을 잡으면 줄 서 있던 실행이 앞 실행의 결과를 못 보고 같은 항목을 또 만든다(2026-09-22 중복)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: site
        run: |
          corepack enable
          CI=true pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Tidy the growth documents # 완료 항목은 백로그에서 GROW-DONE 으로, 긴 로그는 월별 보관 — 백로그엔 열린 항목만 남는다
        run: node patrol/grow-tidy.mjs

      - name: Implement one backlog item
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 모델: Fable 우선, 토큰·권한이 없으면 Opus 5.5 로 재시도(운영자 2026-09-28)
          claude --model claude-fable-5-1 --dangerously-skip-permissions -p "Read patrol/GROW.md and do exactly what it says for today. Repo root is the current directory. Do not run git commit or git push; the workflow does that. When done, print a one-line summary starting with SUMMARY:." --output-format stream-json --verbose > /tmp/grow.jsonl || true
          if ! grep -q '"type":"result"' /tmp/grow.jsonl 2>/dev/null || grep -qiE 'not available|invalid model|does not have access|not found|permission' /tmp/grow.jsonl; then echo "fable unavailable — falling back to opus 5.5"; claude --model claude-opus-5-5 --dangerously-skip-permissions -p "Read patrol/GROW.md and do exactly what it says for today. Repo root is the current directory. Do not run git commit or git push; the workflow does that. When done, print a one-line summary starting with SUMMARY:." --output-format stream-json --verbose > /tmp/grow.jsonl || true
          fi
          node -e "const l=require('fs').readFileSync('/tmp/grow.jsonl','utf8').trim().split('\n');for(const x of l.slice(-3)){try{const e=JSON.parse(x);if(e.type==='result')console.log('RESULT:',String(e.result??'').slice(0,800))}catch{}}" || true

      # 허용 경로 밖의 변경은 되돌린다 — 모델이 어디를 만졌든 규칙이 이긴다
      - name: Enforce the allowed paths
        run: |
          git add -A
          CHANGED=$(git diff --cached --name-only)
          echo "$CHANGED"
          # 2026-09-28 컨셉 전환: 성장의 주 무대는 game/ (Godot). 웹 엔진·광장·Climb 은 유지 보수만(GROW.md). 사람이 만든 게임 폴더·registry 는 건드리지 못한다
          BAD=$(echo "$CHANGED" | grep -v -E '^(game/|patrol/GROW-BACKLOG\.md|patrol/GROW-LOG\.md|patrol/GROW-DONE\.md|patrol/growth/)' || true)
          if [ -n "$BAD" ]; then echo "reverting out-of-scope changes:"; echo "$BAD"; echo "$BAD" | xargs -r git checkout HEAD -- ; echo "$BAD" | xargs -r git rm -q --cached --ignore-unmatch; fi
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then echo "nothing=1" >> "$GITHUB_ENV"; fi
          # 코드 줄 수 상한 900 — 데이터·에셋(game/data, game/assets, *.json, *.svg)은 원래 길어서 따로 센다(2026-09-28: 주민 명부 하나로 901줄이 되어 하루치가 버려졌다)
          LINES=$(git diff --cached --numstat | grep -v -E '\s(game/data/|game/assets/)|\.(json|svg)$' | awk '{a+=$1+$2} END {print a+0}'); echo "changed code lines: $LINES"
          DATA=$(git diff --cached --numstat | grep -E '\s(game/data/|game/assets/)|\.(json|svg)$' | awk '{a+=$1+$2} END {print a+0}'); echo "changed data/asset lines: $DATA"
          if [ "$LINES" -gt 900 ] || [ "$DATA" -gt 6000 ]; then echo "too big — discarding"; git reset -q --hard; echo "nothing=1" >> "$GITHUB_ENV"; fi

      # game/ 을 건드렸으면 Godot 4.3 헤드리스로 임포트하고 5프레임 돌린다 — 스크립트 오류(SCRIPT ERROR)가 하나라도 있으면 실패
      - name: Gate — Godot headless (game/)
        if: env.nothing != '1'
        run: |
          if git diff --cached --name-only | grep -q '^game/'; then
            # 에셋 규칙(뷰박스·팔레트·금지 요소)을 먼저 — 어기면 그 실행은 버린다
            if ! node game/tools/lint-assets.mjs; then echo "assets: lint failed — discarding"; git reset -q --hard; echo "nothing=1" >> "$GITHUB_ENV"; exit 0; fi
            curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            unzip -qo /tmp/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
            G=/tmp/godot/Godot_v4.3-stable_linux.x86_64
            $G --headless --path game --import 2>&1 | tee /tmp/godot-import.log | tail -20
            $G --headless --path game --quit-after 5 2>&1 | tee /tmp/godot-run.log | tail -20
            if grep -q -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/godot-import.log /tmp/godot-run.log; then echo "godot: script errors — discarding"; git reset -q --hard; echo "nothing=1" >> "$GITHUB_ENV"; fi
          else echo "game/ untouched"; fi

      - name: Gate — typecheck, tests, build
        if: env.nothing != '1'
        working-directory: site
        run: |
          npx tsc --noEmit -p .
          node tests/schema-parity.test.mjs
          node tests/app-parity.test.mjs || true
          # 빌드가 /sitemap.xml 을 프리렌더하며 로컬 D1 을 읽는다 — 러너엔 테이블이 없으니 스키마를 먼저 넣는다
          npx wrangler d1 execute pz-db --local --file=./schema.sql >/dev/null
          # OpenNext 가 내부에서 `pnpm build` 를 부르면 pnpm 이 lockfile 동결 검사로 죽는다 — next build 는 직접, OpenNext 는 그걸 건너뛴다
          NEXT_PRIVATE_STANDALONE=true npx next build # OpenNext 는 standalone 출력을 읽는다(자기가 빌드할 땐 이 env 를 스스로 건다)
          npx opennextjs-cloudflare build --skipNextBuild

      - name: Commit and deploy
        if: env.nothing != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57bb730630ace30ef33217fb43d029cf
        run: |
          git config user.name "square-grow"
          git config user.email "square-grow@population.town"
          SUMMARY=$(grep -o 'SUMMARY:.*' /tmp/grow.jsonl | tail -1 | sed 's/SUMMARY: *//' | tr -d '"\\' | cut -c1-72)
          AREA=$(git diff --cached --name-only | grep -q '^game/' && echo game || echo square)
          git commit -q -m "feat(${AREA}): ${SUMMARY:-daily growth} [grow]"
          # 같은 시간에 사람이 main 을 밀었을 수 있다(백로그 편집 등). rebase 가 충돌하면 버리지 말고 병합한다 — 충돌 구간은 이 커밋(ours) 우선.
          # 예전엔 `pull --rebase || true` 였는데, 충돌하면 조용히 삼키고 빈 push 를 해서 하루치 작업이 러너에서 사라졌다.
          git fetch -q origin main
          if ! git rebase -q origin/main; then git rebase --abort; git merge -q -X ours origin/main -m "merge: main into the day's growth"; fi
          git push origin HEAD:main
          # 사이트를 건드린 날만 배포한다 — game/ 만 자란 날은 올릴 게 없다
          if git diff --name-only HEAD~1 HEAD | grep -q '^site/'; then cd site && npx wrangler deploy; else echo "site untouched — no deploy"; fi # 위 게이트가 만든 .open-next 를 그대로 올린다 (opennextjs deploy 는 pnpm build 를 다시 불러 lockfile 검사로 죽는다)
