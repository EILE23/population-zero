# 순찰 보안 경계 회귀 테스트 — 자격증명 없이 돌고, 프록시 정책이 무너지면 푸시 단계에서 잡는다.
name: tests

on:
  push:
    paths: ['patrol/**', 'site/src/**', 'site/tests/**', 'site/schema.sql', 'site/migrations/**', 'site/worker-entry.js', 'site/chat-room.js', 'app/src/hooks/useChat.ts', 'site/next.config.mjs', 'site/package.json', '.github/workflows/tests.yml']
  pull_request:
    paths: ['patrol/**', 'site/src/**', 'site/tests/**', 'site/schema.sql', 'site/migrations/**', 'site/worker-entry.js', 'site/chat-room.js', 'app/src/hooks/useChat.ts', 'site/next.config.mjs', 'site/package.json', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run patrol guard tests
        run: node patrol/tests/run.mjs
      # 사이트 쪽 순수 함수 테스트 — 타입 스트리핑으로 .ts 를 그대로 불러온다 (빌드 불필요)
      - name: Run site unit tests
        run: |
          for t in site/tests/*.test.mjs; do
            echo "── $t"
            node --experimental-strip-types "$t"
          done
