name: build-game-client

# POZ 데스크톱 클라이언트(Windows) — game/ 이 바뀔 때마다 내보내 GitHub Releases 에 올린다(2026-10-06).
# 버전: 0.1.<main 의 커밋 수> — res://version.txt 에 써서 게임이 제 버전을 안다. 릴리스 client-v0.1.N 에 POZ-windows.zip(처음 받는 사람)·POZ.pck(업데이트)·version.json.
# 게임은 releases/latest/download/version.json 을 보고 빌드 번호가 크면 POZ.pck 만 받아 끌 때 바꿔 끼운다(game/scripts/client_update.gd).
# 엔진을 올리면(4.3 → …) ENGINE 을 바꾼다 — 그 릴리스는 pck 만으로는 안 되니 게임이 새로 받으라고 안내한다.
on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/build-game-client.yml']
  workflow_dispatch:

concurrency:
  group: build-game-client
  cancel-in-progress: true

permissions:
  contents: write

env:
  ENGINE: '4.3'
  KEEP: 20

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          N=$(git rev-list --count HEAD)
          echo "version=0.1.$N" >> "$GITHUB_OUTPUT"
          echo "0.1.$N" > game/version.txt
      - name: Export (Windows)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ ! -d ~/.local/share/godot/export_templates/4.3.stable ]; then mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/; fi
          mkdir -p game/export/windows
          godot --headless --path game --import 2>&1 | tail -5 || true
          godot --headless --path game --export-release "Windows Desktop" export/windows/POZ.exe 2>&1 | tail -20
          ls -la game/export/windows
          test -f game/export/windows/POZ.exe && test -f game/export/windows/POZ.pck
      - name: Package
        run: |
          V=${{ steps.v.outputs.version }}
          cd game/export/windows
          printf 'POZ %s\r\n\r\nRun POZ.exe. Keep POZ.exe and POZ.pck in the same folder.\r\nThe game updates itself: new versions download in the background and apply when you quit.\r\nSign in: press S in the game, then Connect in your browser.\r\n\r\nhttps://population.town\r\n' "$V" > README.txt
          (command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip >/dev/null))
          zip -q -9 ../POZ-windows.zip POZ.exe POZ.pck README.txt
          cp POZ.pck ../POZ.pck
          cd ..
          REPO=${{ github.repository }}
          printf '{"version":"%s","engine":"%s","pck_url":"https://github.com/%s/releases/download/client-v%s/POZ.pck","zip_url":"https://github.com/%s/releases/download/client-v%s/POZ-windows.zip","commit":"%s"}\n' "$V" "$ENGINE" "$REPO" "$V" "$REPO" "$V" "${{ github.sha }}" > version.json
          cat version.json; ls -la
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-v${{ steps.v.outputs.version }}
          name: POZ ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            POZ for Windows, ${{ steps.v.outputs.version }}. Download POZ-windows.zip, unzip, run POZ.exe. Installed copies update themselves.
            ${{ github.event.head_commit.message }}
          files: |
            game/export/POZ-windows.zip
            game/export/POZ.pck
            game/export/version.json
      - name: Keep the last releases only
        uses: actions/github-script@v7
        with:
          script: |
            const keep = Number(process.env.KEEP);
            const all = await github.paginate(github.rest.repos.listReleases, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const client = all.filter((r) => r.tag_name.startsWith('client-v')).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const r of client.slice(keep)) {
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: r.id });
              await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${r.tag_name}` }).catch(() => {});
            }
